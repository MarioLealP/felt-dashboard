[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.87"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"

# Outbound calls to felt-core go through this plugin (native Rust HTTP
# client, not the webview's own fetch) rather than the browser's fetch —
# a real bug found 2026-09-12: WebKitGTK on Linux fails POST requests
# whose body isn't a trivial string (a JSON chat message, or a multipart
# voice-chat upload) with a generic "TypeError: Load failed", while a
# plain-string POST and all GETs work fine. Root cause not fully pinned
# down (looked like CORS preflight at first, but a multipart upload with
# no preflight failed the same way) — rather than keep chasing an
# obscure webkit2gtk/soup3 quirk, route through Tauri's own HTTP client,
# which isn't subject to the webview's network stack at all.
tauri-plugin-http = "2"
cpal = "0.17.1"
hound = "3.5.1"
ashpd = { version = "0.13.13", features = ["tokio", "global_shortcuts"] }
futures-util = "0.3.34"
dotenvy = "0.15.7"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "sync"] }
reqwest = { version = "0.13.5", features = ["json"] }
zbus = { version = "5.19.0", features = ["tokio"] }

# Linux only: WebKitGTK doesn't grant getUserMedia (mic) access without an
# explicit permission-request handler — wry/Tauri don't wire one up by
# default (see lib.rs). Version pinned to match what wry itself already
# pulls in (Cargo.lock), not a separate/newer copy.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"
