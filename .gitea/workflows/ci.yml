name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # version comes from package.json "packageManager"
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: format (oxfmt)
        run: pnpm fmt:check

      - name: lint (oxlint)
        run: pnpm lint

      - name: types (tsc)
        run: pnpm typecheck

      - name: test (vitest)
        run: pnpm test

      - name: build (vite)
        run: pnpm build

  deploy:
    needs: smell
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: actions/checkout@v4
      - name: build, push, promote (shared deploy.sh, WP-53)
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          INFRA_DEPLOY_KEY: ${{ secrets.INFRA_DEPLOY_KEY }}
          INFRA_REPO_URL: ${{ secrets.INFRA_REPO_URL }}
          INFRA_KNOWN_HOSTS: ${{ secrets.INFRA_KNOWN_HOSTS }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: curl -fsSL https://git.clockmost.com/Benylin/ci-workflows/raw/branch/main/deploy.sh | bash -s -- felt-app
